name: Ses Testi (adaylari dinle)

on:
  workflow_dispatch:

jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: edge-tts kur
        run: pip install -q edge-tts
      - name: Aday sesleri uret (TR ornek cumle)
        run: |
          mkdir -p sesler
          TEXT="Bir gun Hoca gol kiyisina comelmis, kasik kasik golu mayaliyormus. Yoldan gecen koylu sasirip sormus. Hoca da gulumseyip cevap vermis: Ya tutarsa?"
          for V in en-US-AndrewMultilingualNeural en-US-BrianMultilingualNeural en-US-EmmaMultilingualNeural en-US-AvaMultilingualNeural de-DE-SeraphinaMultilingualNeural tr-TR-AhmetNeural; do
            edge-tts --voice "$V" --rate=-6% --text "$TEXT" --write-media "sesler/${V}.mp3"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ses-adaylari
          path: sesler/
